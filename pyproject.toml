[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "urban-digital-twin"
version = "1.0.0"
description = "Smart City AI Research System — Urban Digital Twin"
requires-python = ">=3.10"
dependencies = [
    "mesa>=2.1",
    "networkx>=3.2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "torch>=2.0",
    "stable-baselines3>=2.0",
    "gymnasium>=0.29",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "streamlit>=1.32",
    "plotly>=5.20",
    "folium>=0.16",
    "streamlit-folium>=0.18",
    "mlflow>=2.11",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "black>=24.0", "ruff>=0.3"]
osm = ["osmnx>=1.9"]

[tool.ruff]
line-length = 100
