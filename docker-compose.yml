version: "3.9"

services:
  simulation:
    build: .
    container_name: udt_simulation
    command: python scripts/run_simulation.py --ticks 10080
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app

  api:
    build: .
    container_name: udt_api
    command: uvicorn src.api_layer.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
    depends_on:
      - simulation

  dashboard:
    build: .
    container_name: udt_dashboard
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
