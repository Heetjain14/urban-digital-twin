algorithm: PPO
policy: MlpPolicy
total_timesteps: 200000
n_steps: 1024
batch_size: 64
n_epochs: 10
gamma: 0.99
learning_rate: 0.0003
clip_range: 0.2
ent_coef: 0.01
verbose: 1
tensorboard_log: logs/rl_tensorboard

reward_weights:
  wait_time_penalty: -0.6
  throughput_reward: 0.3
  energy_efficiency: 0.1
  anomaly_penalty: -5.0

environment:
  ticks_per_step: 10          # RL acts every 10 sim ticks
  episode_length_ticks: 1440  # 1 simulated day per episode
  observation_dim: 20
  num_intersections: 4
  num_districts: 3
